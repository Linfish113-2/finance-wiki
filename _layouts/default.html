<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111e" />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要內容</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Finance Wiki 首頁">
        <span class="brand-mark" aria-hidden="true"><span class="mark-bars">▂▅▇</span></span>
        <span>Finance<span class="accent">Wiki</span><small>金融知識實驗室</small></span>
      </a>
      <nav class="top-nav" aria-label="主要導覽">
        <a href="{{ '/' | relative_url }}#explore">探索分類</a>
        <a href="{{ '/' | relative_url }}#library">知識文章</a>
        <a href="{{ '/about/' | relative_url }}">關於本站</a>
      </nav>
      <a class="github-link" href="https://github.com/Linfish113-2" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main-content">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div><div class="footer-title">Finance<span class="accent">Wiki</span></div><p>把金融專業知識，變成每個人都看得懂的生活語言。</p><p class="footer-warning">本站僅供金融教育，不構成個人化投資、保險或法律建議。</p></div>
      <div class="footer-right"><a href="{{ '/about/' | relative_url }}">專案說明</a><a href="https://github.com/Linfish113-2" target="_blank" rel="noopener noreferrer">製作者 GitHub</a><p>國立臺北大學 · 經濟學系<br>製作者：林姵妤</p><small>© {{ 'now' | date: '%Y' }} Finance Wiki · 自主學習專案</small></div>
    </div>
  </footer>
</body>
</html>
