<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="t d"><title id="t">固定票息債券價格和利率的反向關係</title><desc id="d">假設三種市場利率情境，對應的示意債券價格由105、100下降到95；非市場資料。</desc><rect width="720" height="290" rx="14" fill="#102838"/><text x="28" y="41" fill="#e6f5ff" font-family="sans-serif" font-size="21" font-weight="bold">市場利率上升，固定票息債券價格通常下降</text><text x="28" y="64" fill="#94b8c8" font-family="sans-serif" font-size="13">教學示意，控制其他因素不變；價格為假設指數值</text><path d="M100 230H652M100 86V230" fill="none" stroke="#436276" stroke-width="2"/><text x="33" y="99" fill="#9bbdc8" font-family="sans-serif" font-size="14">價格</text><text x="562" y="260" fill="#9bbdc8" font-family="sans-serif" font-size="14">市場利率情境</text><path d="M135 112L355 155L585 205" fill="none" stroke="#4ce0d4" stroke-width="4"/><g fill="#4ce0d4"><circle cx="135" cy="112" r="8"/><circle cx="355" cy="155" r="8"/><circle cx="585" cy="205" r="8"/></g><g font-family="sans-serif" font-size="16" fill="#e7f6ff"><text x="124" y="93">105</text><text x="345" y="136">100</text><text x="575" y="186">95</text></g><g font-family="sans-serif" font-size="14" fill="#a5c4d2"><text x="107" y="250">較低</text><text x="331" y="250">基準</text><text x="560" y="250">較高</text></g></svg>
