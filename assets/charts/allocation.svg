<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="t d"><title id="t">資產配置教學假設</title><desc id="d">在十萬元的虛構投資組合中，股票類占50%、債券類占30%、現金類占20%。不構成建議。</desc><rect width="720" height="270" rx="14" fill="#102838"/><text x="30" y="42" fill="#e6f5ff" font-family="sans-serif" font-size="21" font-weight="bold">三種資產，思考不同風險來源</text><text x="30" y="68" fill="#94b8c8" font-family="sans-serif" font-size="13">教學假設：總額 100,000 元；比例僅供計算練習</text><rect x="30" y="100" width="330" height="55" rx="8" fill="#38dec9"/><rect x="360" y="100" width="198" height="55" fill="#5eaaff"/><path d="M558 100H682Q690 100 690 108V147Q690 155 682 155H558Z" fill="#b5a1e6"/><g fill="#102838" font-family="sans-serif" font-size="18" font-weight="bold"><text x="153" y="134">50%</text><text x="435" y="134">30%</text><text x="613" y="134">20%</text></g><g font-family="sans-serif" font-size="15" fill="#d3e7f1"><text x="30" y="191">● 股票類 50,000 元</text><text x="270" y="191">● 債券類 30,000 元</text><text x="515" y="191">● 現金類 20,000 元</text></g><text x="30" y="233" fill="#89abbd" font-family="sans-serif" font-size="12">非實際商品或投資配置建議；投資需衡量風險承受度與期限。</text></svg>
