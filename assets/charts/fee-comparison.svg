<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="t d"><title id="t">年度費用比較（教學假設）</title><desc id="d">假設資產十萬元不變，費用率0.2%對應兩百元，1%對應一千元，僅比較單年費用。</desc><rect width="720" height="270" rx="14" fill="#102838"/><text x="30" y="42" fill="#e6f5ff" font-family="sans-serif" font-size="21" font-weight="bold">相同資產，費用率不同</text><text x="30" y="66" fill="#94b8c8" font-family="sans-serif" font-size="13">教學假設：投入 NT$100,000，未考慮報酬與資產變動</text><text x="30" y="115" fill="#b5ceda" font-family="sans-serif" font-size="17">0.2%</text><rect x="115" y="92" width="90" height="32" rx="6" fill="#45e1d0"/><text x="218" y="114" fill="#e6f5ff" font-family="sans-serif" font-size="17">NT$200</text><text x="30" y="170" fill="#b5ceda" font-family="sans-serif" font-size="17">1.0%</text><rect x="115" y="147" width="450" height="32" rx="6" fill="#5eaff8"/><text x="575" y="170" fill="#e6f5ff" font-family="sans-serif" font-size="17">NT$1,000</text><text x="30" y="236" fill="#87a8b9" font-family="sans-serif" font-size="12">示意比例依費用金額繪製；不代表任何商品的實際費率。</text></svg>
